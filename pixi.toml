[workspace]
name = "cameraunlock-core"
version = "1.0.0"
description = "Cross-platform head tracking library for Unity game mods"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64"]

[tasks]
# Testing
test = "dotnet test csharp --verbosity normal"
test-quick = "dotnet test csharp --verbosity quiet"
test-coverage = "dotnet test csharp --collect:\"XPlat Code Coverage\""

# The C++ half of the library has its own suite. It is a separate build system,
# so it needs its own task - without one `pixi run test` silently covers only
# the C# port, and a C++-only regression (the two interpolators, the projection
# maths, the receivers) reaches every native mod ungated.
test-cpp = { cmd = "ctest --test-dir cpp/build-test -C Release --output-on-failure", depends-on = ["build-cpp"] }
build-cpp = "cmake -S cpp -B cpp/build-test -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build-test --config Release"

# Pipeline conformance vectors. data/pipeline-conformance.json is the executable
# form of the "Check." paragraphs in docs/porting-the-pipeline.md, and the
# language ports that reimplement the pipeline run the SAME file. Running it here
# against both of our own implementations is what makes core the place a moved
# constant or a reordered step fails first, rather than a mod repo six weeks
# later. The two harnesses hold no assertion logic - run-vectors.mjs owns that,
# so every implementation is checked by the same code.
# (Distinct from `conformance` below, which lints mod REPOS against the
# packaging invariants. This one checks the maths.)
build-vectors-cpp = "cmake -S scripts/pipeline-vectors/harness/cpp -B scripts/pipeline-vectors/harness/cpp/build && cmake --build scripts/pipeline-vectors/harness/cpp/build --config Release"
vectors-cpp = { cmd = "node scripts/pipeline-vectors/run-vectors.mjs --harness scripts/pipeline-vectors/harness/cpp/build/Release/conformance_harness.exe", depends-on = ["build-vectors-cpp"] }

build-vectors-csharp = "dotnet build scripts/pipeline-vectors/harness/csharp/ConformanceHarness.csproj -c Release --nologo -v quiet"
vectors-csharp = { cmd = "node scripts/pipeline-vectors/run-vectors.mjs --harness scripts/pipeline-vectors/harness/csharp/bin/Release/net8.0/ConformanceHarness.exe", depends-on = ["build-vectors-csharp"] }

vectors = { depends-on = ["vectors-cpp", "vectors-csharp"] }

# Windows-only: the powershell/ modules are a Windows surface, so this is not
# part of `check`. Covers the vendoring soak that keeps update-deps off
# freshly-published upstream releases.
test-powershell = "powershell -NoProfile -ExecutionPolicy Bypass -File powershell/tests/ModLoaderSetup.Soak.Tests.ps1"

# Building
build = "dotnet build csharp -c Release"
build-debug = "dotnet build csharp -c Debug"
clean = "dotnet clean csharp"
restore = "dotnet restore csharp"

# Full rebuild
rebuild = { depends-on = ["clean", "build"] }

# Packaging
pack = "dotnet pack csharp -c Release -o dist"

# Validate a built installer ZIP is a coherent manifest-mode package
# (delivery_mode == "manifest" and every declared source exists in the zip).
# No args: validates the host repo's own release/*-installer.zip - run after
# packaging. Or pass repo tokens / zip paths to validate across a checkout:
#   pixi run validate-manifest
#   pixi run validate-manifest dying-light-2 bioshock-remastered
#   pixi run validate-manifest path/to/Mod-v1.0.0-installer.zip
validate-manifest = "node scripts/validate-manifest.mjs"

# Check THIRD-PARTY-NOTICES.md actually reproduces the licence of everything
# compiled into the binary. Copy-LicenceNotices covers whether the file ships;
# this covers whether its contents discharge the obligation.
# No args: validates the host repo. Or pass repo tokens to sweep a checkout:
#   pixi run validate-notices
#   pixi run validate-notices witcher-3 subnautica-2
validate-notices = "node scripts/validate-notices.mjs"

# Lint a mod repo, or the whole fleet, against the invariants core owns: the
# install/uninstall wrapper tails, the delayed-expansion pin that decides
# whether a game path containing `!` installs, the arg-parser contract lopari
# drives, .cmd line endings, the canonical pixi task set, SHA-pinned actions,
# the notices/submodule core commit, launcher-manifest.json, LICENSE and the
# README claims AGENTS.md forbids. Reports; sync-templates.ps1 fixes.
#   pixi run conformance
#   pixi run conformance -All
#   pixi run conformance -All -Json
#   pixi run conformance -Repo valheim -Check install-wrapper,action-pins
conformance = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/conformance.ps1"

# Push core's templates back out across the fleet: install/uninstall wrapper
# tails, the mechanical half of update-deps.ps1, GitHub Actions pins from
# scripts/templates/action-pins.json, and the `sync` pixi task. Reports by
# default; -Apply writes files and never stages or commits.
#   pixi run sync-templates -All
#   pixi run sync-templates -All -Apply
#   pixi run sync-templates -Repo valheim -Only action-pins
sync-templates = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync-templates.ps1"

# Development workflow
check = { depends-on = ["build-debug", "test-quick", "test-cpp", "vectors"] }

# Documentation
# doc = "docfx docfx.json"

[dependencies]
nodejs = ">=20"
