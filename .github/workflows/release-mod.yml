# ============================================================================
# Release Mod - the fleet's one release workflow
# ============================================================================
# Called via `workflow_call` from every head-tracking mod's release.yml. The
# caller owns three things: the tag trigger, the values below, and `secrets:
# inherit`. Everything else - what gets built, how, and what is announced -
# lives here so that a fix lands once instead of in fifty hand-maintained
# copies that were already 190-of-250 lines identical when this was written.
#
# Keyed on VERSION SOURCE, not on toolchain. The only step that cares whether a
# mod is BepInEx C#, an ASI built with CMake, a Rust cdylib or a Lua drop-in is
# the tag-vs-file version check; everything downstream of it is loader-agnostic
# because `pixi run package` is what produces the artifact in all of them.
#
# The build is deliberately one line. Per AGENTS.md, CI must go through the
# same `pixi run` a developer runs, so there is no dotnet/msbuild/cmake/cargo
# invocation anywhere in this file - if a mod needs a compiler set up, it asks
# for it with `dotnet-version` / `setup-msbuild` and puts the build itself in
# its own pixi task chain.
#
# Callers MUST pin this workflow to a commit SHA, not @main: the job holds
# contents:write, DISCORD_RELEASE_WEBHOOK and LOPARI_APP_ACTIONS_TOKEN, and at
# @main whatever lands on core's default branch runs with all three.
# scripts/conformance.ps1's `workflow-ref` check fails a caller that does not.
#
# The three announcement steps (pre-flight, catalog pin, Discord) are the
# canonical text from scripts/templates/*.yml and are reconciled in place by
# scripts/sync-discord-announce.mjs, which now treats this file as one more
# target. Do not hand-edit them here; edit the template and re-run that script.
# ============================================================================

name: Release Mod

on:
  workflow_call:
    inputs:
      project-name:
        description: "Human-readable name for the release title and notes (e.g. 'Head Tracking for Valheim')"
        required: true
        type: string
      version-source:
        description: "Where this mod's authoritative version lives: csproj | cmake | cargo | pixi | manifest"
        required: true
        type: string
      version-path:
        description: "Path to the file named by version-source (e.g. src/ValheimHeadTracking/ValheimHeadTracking.csproj)"
        required: true
        type: string
      version-key:
        description: "manifest only: dotted path to the version property (launcher-manifest.json nests it at mod_info.version)"
        required: false
        type: string
        default: "version"
      version-pattern:
        description: "regex only: pattern capturing the version. Several capture groups are joined with '.', for headers that split MAJOR/MINOR/PATCH"
        required: false
        type: string
        default: ""
      artifact-paths:
        description: "Whitespace-separated paths whose history feeds the generated release notes"
        required: true
        type: string
      package-task:
        description: "pixi task that builds and packages the release ZIP"
        required: false
        type: string
        default: "package"
      pixi-environment:
        description: "pixi environment to run the package task in (empty = default environment)"
        required: false
        type: string
        default: ""
      dotnet-version:
        description: "Set up this .NET SDK before packaging (empty = no .NET toolchain needed)"
        required: false
        type: string
        default: ""
      setup-msbuild:
        description: "Add MSBuild to PATH before packaging"
        required: false
        type: boolean
        default: false
      runs-on:
        description: "Runner label for the release job"
        required: false
        type: string
        default: "windows-latest"
      timeout-minutes:
        description: "Job timeout. The catalog pin sync alone can wait 10 minutes, so leave headroom above the build"
        required: false
        type: number
        default: 30

jobs:
  release:
    name: Build and Release
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: write

    steps:
      - name: Require release announcement prerequisites
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          LOPARI_APP_ACTIONS_TOKEN: ${{ secrets.LOPARI_APP_ACTIONS_TOKEN }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - every release must be announced to Discord, so this run is refused before the release is created. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run."
            exit 1
          }
          $bust = "cb$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          $mods = (Invoke-RestMethod "https://lopari.app/mods.json?$bust").mods
          $entry = @($mods) | Where-Object { $_.repo -eq "${{ github.repository }}" }
          # The served catalog is ALREADY filtered to public entries - update-metadata.mjs
          # writes the Pages copy as { ...catalog, mods: publicMods } - so there is no
          # public/private test to make here; anything we find is public by construction.
          #
          # External is our own heuristic, not a field lopari consults: those installs route
          # to a third-party mod manager and ship no *-installer.zip, and an installer zip is
          # what update-metadata.mjs actually requires before it will stamp a pin.
          #
          # Known gap, deliberately left loud: lopari also skips any entry that is not yet
          # `released` and has no dev-release, so a mod's FIRST stable release is never
          # auto-pinned and the poll below runs its deadline out. That failure is correct -
          # the Run in Lopari link really would be stale - and the timeout message says so.
          if ($entry -and @($entry)[0].install_strategy -eq 'External') { $entry = $null }
          if ($entry -and -not $env:LOPARI_APP_ACTIONS_TOKEN) {
            Write-Host "::error::${{ github.repository }} is in the Lopari catalog but LOPARI_APP_ACTIONS_TOKEN is not set - the catalog pin can't be synced before the announcement, so the Run in Lopari link would serve the previous release. Set the fine-grained PAT (Actions:write on itsloopyo/lopari.app only) and re-run."
            exit 1
          }
          Write-Host "Release announcement prerequisites present."

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Full history: generate-release-notes.ps1 reads the commit range
          # since the previous tag, and a shallow clone has no previous tag.
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        shell: pwsh
        env:
          # Read through the environment, never interpolated into the script body.
          # ${{ }} is substituted textually before pwsh parses the run block, so a tag
          # name containing a double quote closes the assignment and the remainder runs
          # as code - in a job holding contents:write plus the Discord and Lopari
          # secrets, reachable by anyone who can push a tag. The format check below
          # cannot help: the injected code runs on the assignment line, before it.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "::error::Tag format invalid. Use semantic versioning: v1.2.3"
            exit 1
          }
          $version = $matches[1]
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Validate version matches source
        shell: pwsh
        env:
          VERSION_SOURCE: ${{ inputs.version-source }}
          VERSION_PATH: ${{ inputs.version-path }}
          VERSION_KEY: ${{ inputs.version-key }}
          VERSION_PATTERN: ${{ inputs.version-pattern }}
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          Import-Module ./cameraunlock-core/powershell/ReleaseWorkflow.psm1 -Force
          $fileVersion = Get-ProjectVersion -Source $env:VERSION_SOURCE -Path $env:VERSION_PATH -Key $env:VERSION_KEY -Pattern $env:VERSION_PATTERN

          Write-Host "$($env:VERSION_PATH) version: $fileVersion"
          Write-Host "Tag version: $($env:TAG_VERSION)"

          if ($fileVersion -ne $env:TAG_VERSION) {
            Write-Host "::error::Version mismatch! Tag is v$($env:TAG_VERSION) but $($env:VERSION_PATH) has $fileVersion"
            exit 1
          }

          Write-Host "Version matches."

      - name: Setup .NET
        if: inputs.dotnet-version != ''
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Setup MSBuild
        if: inputs.setup-msbuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      - name: Build and package
        shell: pwsh
        env:
          PACKAGE_TASK: ${{ inputs.package-task }}
          PIXI_ENVIRONMENT: ${{ inputs.pixi-environment }}
        run: |
          # The only build command in this file, and it is the same one a
          # developer runs. Anything the mod needs doing first belongs in that
          # task's depends-on chain, not in a step here.
          if ($env:PIXI_ENVIRONMENT) {
            pixi run -e $env:PIXI_ENVIRONMENT $env:PACKAGE_TASK
          } else {
            pixi run $env:PACKAGE_TASK
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::'pixi run $($env:PACKAGE_TASK)' failed."
            exit 1
          }

      - name: Generate release notes
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ inputs.artifact-paths }}
          PROJECT_NAME: ${{ inputs.project-name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $artifactPaths = $env:ARTIFACT_PATHS -split '\s+' | Where-Object { $_ }

          & cameraunlock-core/scripts/generate-release-notes.ps1 `
            -Version $env:RELEASE_VERSION `
            -ArtifactPaths $artifactPaths `
            -ProjectName $env:PROJECT_NAME

      - name: Find release ZIPs
        id: find_zips
        shell: pwsh
        run: |
          # Every mod's package task writes release/<Name>-v<version>-installer.zip;
          # the NexusMods variant is optional and only some mods produce it.
          $installerZip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          $nexusZip = Get-ChildItem release/*-nexus.zip -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $installerZip) {
            Write-Host "::error::No release/*-installer.zip after 'pixi run ${{ inputs.package-task }}'. The package task must write the installer ZIP into release/."
            exit 1
          }

          echo "installer_zip=$($installerZip.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Installer: $($installerZip.Name)"
          if ($nexusZip) {
            echo "nexus_zip=$($nexusZip.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "NexusMods: $($nexusZip.Name)"
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_NAME: ${{ inputs.project-name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $installerZip = "${{ steps.find_zips.outputs.installer_zip }}"
          $nexusZip = "${{ steps.find_zips.outputs.nexus_zip }}"
          $assets = @($installerZip)
          if ($nexusZip) { $assets += $nexusZip }

          gh release create $env:RELEASE_TAG `
            --title "$($env:PROJECT_NAME) $($env:RELEASE_TAG)" `
            --notes-file "release-notes.txt" `
            @assets

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to create GitHub release"
            exit 1
          }

          Write-Host "Released: https://github.com/${{ github.repository }}/releases/tag/$($env:RELEASE_TAG)"

      - name: Sync Lopari catalog pin
        shell: pwsh
        env:
          LOPARI_APP_ACTIONS_TOKEN: ${{ secrets.LOPARI_APP_ACTIONS_TOKEN }}
          # See the note in discord-announce-step.yml: a tag name is attacker-controlled
          # text and must not be interpolated into a run block that holds a token.
          REF_NAME: ${{ github.ref_name }}
        run: |
          $repo = "${{ github.repository }}"
          $version = $env:REF_NAME -replace '^v', ''
          function Get-PinnedVersion {
            $bust = "cb$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
            $mods = (Invoke-RestMethod "https://lopari.app/mods.json?$bust").mods
            $entry = @($mods) | Where-Object { $_.repo -eq $repo }
            if (-not $entry) { return $null }
            # See the note on the prerequisites step above: the served catalog is already
            # public-only, External is our stand-in for "ships no installer zip", and a
            # first release genuinely has no pin to find until lopari stamps one.
            if (@($entry)[0].install_strategy -eq 'External') { return $null }
            return @{ inCatalog = $true; pinned = $entry.release.pinned.version }
          }
          $state = Get-PinnedVersion
          if (-not $state) {
            Write-Host "::notice::$repo has no syncable Lopari catalog pin (no entry, or External install strategy) - the /run/ page serves its own install steps."
            exit 0
          }
          if ($state.pinned -eq $version) {
            Write-Host "Catalog already pins $version."
            exit 0
          }
          function Request-Repin {
            Invoke-RestMethod -Method Post `
              -Uri 'https://api.github.com/repos/itsloopyo/lopari.app/actions/workflows/update-pins.yml/dispatches' `
              -Headers @{ Authorization = "Bearer $env:LOPARI_APP_ACTIONS_TOKEN"; Accept = 'application/vnd.github+json' } `
              -ContentType 'application/json' -Body '{"ref":"main"}'
          }
          Request-Repin
          Write-Host "Requested lopari.app catalog re-pin; waiting for $version to go live..."
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          $tick = 0
          while ([DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 15
            $tick++
            try {
              $state = Get-PinnedVersion
            } catch {
              # A transient fetch failure is part of what the poll absorbs;
              # a persistent one runs into the deadline below.
              continue
            }
            if ($state.pinned -eq $version) {
              Write-Host "Catalog pin is live: $version."
              exit 0
            }
            Write-Host "  still pinned at $($state.pinned)..."
            # Two releases dispatching within a minute of each other put two pin
            # runs on the same base commit; the loser's push is rejected and
            # nothing retries it before the hourly schedule. Ask again.
            if ($tick % 5 -eq 0) {
              Write-Host "  re-requesting the catalog re-pin..."
              Request-Repin
            }
          }
          Write-Host "::error::Timed out waiting for lopari.app to pin $version (still $($state.pinned)). Check https://github.com/itsloopyo/lopari.app/actions, then re-run this job - the release exists; only the pin sync and announcement are pending."
          exit 1

      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          # Read through the environment, never interpolated into the script body.
          # ${{ }} is substituted textually before pwsh parses the run block, so a tag
          # name containing a double quote closes the assignment and the remainder runs
          # as code - in a job that holds the release webhook and contents:write.
          REF_NAME: ${{ github.ref_name }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - the release was created but not announced. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run this job."
            exit 1
          }
          $tag  = $env:REF_NAME
          $repo = "${{ github.repository }}"
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Mod Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**`n**[Run in Lopari](https://lopari.app/run/?repo=$repo)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
