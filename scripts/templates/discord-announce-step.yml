# Canonical "announce release to Discord" step for every head-tracking mod's
# release workflow. Self-contained on purpose: it must work in mods that do not
# check out the cameraunlock-core submodule and across BepInEx/ASI/Rust
# toolchains, so it depends on nothing but github context and the secret.
#
# Synced verbatim into each mod's release workflow by
# scripts/sync-discord-announce.mjs (re-indented to match the target's steps).
# It is placed immediately after the "Create GitHub Release" step. The webhook
# is read from the DISCORD_RELEASE_WEBHOOK repo secret; a missing secret is a
# hard failure - every release must be announced, and the paired early-check
# step (discord-webhook-check-step.yml) refuses the run before the release is
# even created, so this guard only fires if that step was removed.
      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - the release was created but not announced. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run this job."
            exit 1
          }
          $tag  = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Mod Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**`n**[Run in Lopari](https://lopari.app/run/?repo=$repo)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
