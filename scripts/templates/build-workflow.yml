# The fleet's push build, .github/workflows/build.yml in every mod repo.
#
# Everything from `on:` to `jobs:` is copied as it stands. conformance.ps1's
# ci-minutes check holds a mod's build workflow to it:
#
# - concurrency cancels the run a newer push to the same ref has superseded.
#   github.ref keeps branches, and a pull request's merge ref, apart.
# - paths-ignore skips a push that touches only prose.
# - one `pixi run package` step and no test step. package depends on the fast
#   tests (test-unit where the repo has tests/config_differential, test where
#   it does not), so a test step before it ran the whole suite twice, and in a
#   repo with a config differential test `pixi run test` is ten to thirty
#   minutes of a frozen legacy import. The differential runs on the release
#   paths only: release-mod.yml, Publish-NightlyBuild and release.ps1.
#
# Keep the setup steps your build needs and delete the others: setup-dotnet
# for a C# build, setup-msbuild for a CMake build with the Visual Studio
# generator. Pins are scripts/templates/action-pins.json's.

name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # release.ps1's version commit is built by the tag's release workflow.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6

      - name: Build, test and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pixi run package failed"
            exit 1
          }
