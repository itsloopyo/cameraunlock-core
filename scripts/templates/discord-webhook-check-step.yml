# Canonical announcement pre-flight for every head-tracking mod's release
# workflow. Placed as the first step of the release job so a missing secret
# fails the run seconds after the tag push - before anything is built and
# before the GitHub release exists - instead of surfacing after the release
# is live.
#
# Two requirements:
#   - DISCORD_RELEASE_WEBHOOK: always. Every release must be announced.
#   - LOPARI_APP_ACTIONS_TOKEN: only when this repo has a Lopari catalog
#     entry the pin sync applies to. The announcement's "Run in Lopari"
#     link serves whatever the catalog pins, so the pin must be synced
#     (and confirmed live) BEFORE the announce - without the token that
#     sync can't be triggered and the link would install the previous
#     release. External-strategy entries (installs route to a third-party
#     mod manager) never carry a pin, so they don't need the token.
#
# Synced into each mod's release workflow by scripts/sync-discord-announce.mjs
# alongside catalog-pin-dispatch-step.yml and discord-announce-step.yml.
      - name: Require release announcement prerequisites
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          LOPARI_APP_ACTIONS_TOKEN: ${{ secrets.LOPARI_APP_ACTIONS_TOKEN }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - every release must be announced to Discord, so this run is refused before the release is created. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo ${{ github.repository }}' and re-run."
            exit 1
          }
          $bust = "cb$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          $mods = (Invoke-RestMethod "https://lopari.app/mods.json?$bust").mods
          $entry = @($mods) | Where-Object { $_.repo -eq "${{ github.repository }}" }
          if ($entry -and $entry.install_strategy -eq 'External') { $entry = $null }
          if ($entry -and -not $env:LOPARI_APP_ACTIONS_TOKEN) {
            Write-Host "::error::${{ github.repository }} is in the Lopari catalog but LOPARI_APP_ACTIONS_TOKEN is not set - the catalog pin can't be synced before the announcement, so the Run in Lopari link would serve the previous release. Set the fine-grained PAT (Actions:write on itsloopyo/lopari.app only) and re-run."
            exit 1
          }
          Write-Host "Release announcement prerequisites present."
