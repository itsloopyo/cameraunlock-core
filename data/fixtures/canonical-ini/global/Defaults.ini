; CameraUnlock head tracking defaults, read by every head tracking mod that keeps its
; settings in CameraUnlock.ini. A game uses the value here for each setting its
; CameraUnlock.ini sets to default. A value in a game's CameraUnlock.ini changes that game
; only. The mods never change this file.
; Comments start with ; and go on their own line. Text after a value is part of the value.
; Hotkeys are key names such as End, PageUp or Ctrl+Shift+Y. Separate several with commas; leave empty for none.
; Only these key names are read here: A to Z, Alpha0 to Alpha9, F1 to F24, Keypad0 to Keypad9,
; KeypadPeriod, KeypadDivide, KeypadMultiply, KeypadMinus, KeypadPlus, UpArrow, DownArrow,
; LeftArrow, RightArrow, Insert, Delete, Home, End, PageUp, PageDown, Backspace, Tab, Return,
; Space, Escape, Pause, Print, Menu, Numlock, CapsLock, ScrollLock, LeftWindows, RightWindows.
; A value holding any other key makes every game use its built-in keys for that action.

[CameraUnlock]
; Written by the mod. Leave this section in place.
ConfigFormat=1

[Network]
; UDP port the mod receives tracker data on (OpenTrack protocol).
UdpPort=4242

[General]
; true: head tracking is on when the game starts. ToggleKey turns it on and off.
EnableOnStartup=true
; true: yaw turns around the world's up axis. false: around the camera's own up axis.
WorldSpaceYaw=true
; true: turning your head turns the view.
; Tracking mode at startup, with PositionEnabled. The mode hotkey changes both.
RotationEnabled=true
; Milliseconds a tracker packet stays current. Once the tracker has sent nothing
; for this long, the mod stops following it until data arrives again.
DataFreshnessMs=500

[Smoothing]
; Smoothing when the tracker runs on this PC. 0 is the least, 1 the most.
LocalSmoothing=0.0
; Smoothing when the tracker is another device on the network, such as a phone.
; 0 is the least, 1 the most.
RemoteSmoothing=0.15
; How much the Accela filter smooths the trackers AccelaPlayers lists. 0 is the least, 1 the most.
Accela=0.75
; Players whose tracker is smoothed with Accela, such as 2, 3. Leave empty for none.
AccelaPlayers=

[Position]
; true: moving your head moves the view.
; Tracking mode at startup, with RotationEnabled. The mode hotkey changes both.
PositionEnabled=true
; false: while you aim down the sights, leaning keeps your eye on the sights.
; true: the weapon stays put and your head moves freely around it (true free look).
TrueFreeLook=false
; true, with TrueFreeLook=true: an aim marker shows where your shot will land while you aim down the sights.
; It does nothing while TrueFreeLook is false.
FreeLookMarker=false
; true: while you aim down the sights your head stops moving the view, apart from tilting it,
; so the sights sit in the centre as they do without head tracking. At the hip nothing changes.
StockSights=false
; How far, in metres, leaning left or right can move the view.
PositionLimitX=0.3
; How far, in metres, raising your head can move the view.
PositionLimitY=0.2
; How far, in metres, lowering your head can move the view.
PositionLimitYDown=0.2
; How far, in metres, leaning forward can move the view.
PositionLimitZ=0.4
; How far, in metres, leaning back can move the view.
PositionLimitZBack=0.1
; true: leaning stops at walls instead of moving the view through them.
; Only games whose mod sweeps the level for walls read this; the rest ignore it.
CollisionEnabled=true
; How gently the view eases back out after a wall stopped a lean.
; 0 is the quickest, 1 the slowest.
CollisionReleaseSmoothing=0.9

[Hotkeys]
; Turns head tracking on and off.
ToggleKey=End, Ctrl+Shift+Y
; Changes the tracking mode: rotation and position, rotation only, position only.
CycleTrackingModeKey=PageUp, Ctrl+Shift+G
; Switches yaw between the world's up axis and the camera's own (WorldSpaceYaw).
YawModeKey=PageDown, Ctrl+Shift+H
; Cycles the aim mode: sights locked, free look with a marker, true free look, stock sights
; (TrueFreeLook, FreeLookMarker, StockSights).
TrueFreeLookKey=Insert, Ctrl+Shift+U
; Switches the view between first person and the game's own camera, where the game has first person.
FirstPersonKey=ScrollLock, Ctrl+Shift+B

[Light]
; How far the light turns for each degree your head turns.
; 1 matches the view, 0 keeps the light on your aim.
LightMultiplier=1.5

[View]
; The game's field of view in vertical degrees; 60 is about 91 horizontal at 16:9.
; 0 keeps the game's own. Scopes and zoom keep their share of it.
GameFov=0.0
; true: lifts the game's own frame-rate limit where the mod can, at the game's normal speed.
; Leave it false if another mod already unlocks this game's frame rate.
FrameRateUnlock=false
; true: smooths the jagged edges of the game's 3D with FXAA where the mod can.
; It softens fine detail a little; leave it false if the game already has anti-aliasing on.
Fxaa=false
